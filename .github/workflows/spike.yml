name: spike

# Pre-implementation spikes for the whatlicense -> Frida port (§7).
# Spike 1 answers whether the Frida/Stalker primitives the stage port needs
# actually work on the real target platform (windows-2022, ia32 + x64).
# Run locally on Linux too (same driver, same agent), but only the Windows
# run is authoritative.

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "spikes/**"
      - ".github/workflows/spike.yml"

jobs:
  spike1:
    strategy:
      fail-fast: false
      matrix:
        python_arch: [x86, x64]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction Stop; Write-Host 'exclusion added' }
          catch { Write-Host "exclusion failed: $_" }

      # The spike drives frida directly; the packaged unlicense would pull the
      # same pin, but installing it standalone keeps this job independent.
      - name: Install frida
        run: |
          python -m pip install --upgrade pip
          pip install "frida==16.1.3"

      - name: Fetch mingw-w64 for this architecture (builds the spike target)
        run: python scripts/install_mingw.py

      - name: Spike 1 - Stalker viability (stalker + no-Stalker control)
        continue-on-error: true
        run: python spikes/run_spike1.py --opts 0,2 --nostalker

      - name: Upload spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike1-results-${{ matrix.python_arch }}
          path: |
            results/
          if-no-files-found: ignore
          retention-days: 14
