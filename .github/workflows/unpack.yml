name: unpack

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - "unlicense/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/unpack.yml"

jobs:
  unpack:
    # Bitness of the interpreter must match the target PE
    # (interpreter_can_dump_pe), so run both architectures.
    strategy:
      fail-fast: false
      matrix:
        python_arch: [x86, x64]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      # Themida-protected test binaries are often flagged by Defender, which
      # kills them mid-injection ("refused to load frida-agent").
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath 'D:\a' -ErrorAction Stop; Write-Host 'exclusion added' }
          catch { Write-Host "exclusion failed: $_" }

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install mingw-w64 (exports stdcall-decorated names verbatim)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress --limit-output
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          (Get-Command i686-w64-mingw32-gcc -ErrorAction SilentlyContinue) -and (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)

      - name: Prepare samples (download + extract + classify)
        run: python scripts/prepare_samples.py

      - name: Stub missing runtime DLLs
        run: python scripts/stub_missing_dlls.py

      - name: Unpack samples
        run: python scripts/run_unpack.py

      - name: Verify dumps (static + run)
        if: always()
        continue-on-error: true
        run: python scripts/verify_dumps.py

      - name: Upload dumps, logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpack-results-${{ matrix.python_arch }}
          path: |
            results/
          if-no-files-found: ignore
          retention-days: 14
